<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bitCaster-design/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design OS</title>
    <script>
      // Single Page App routing for GitHub Pages
      // Redirects 404s to index.html with the path preserved
      const segment = 1; // number of path segments to keep (repo name)
      const path = window.location.pathname
        .split('/')
        .slice(segment + 1)
        .join('/');
      const search = window.location.search;
      const hash = window.location.hash;

      if (path || search || hash) {
        window.location.replace(
          window.location.origin +
            '/bitCaster-design/' +
            '?p=' + encodeURIComponent('/' + path + search + hash)
        );
      } else {
        window.location.replace(window.location.origin + '/bitCaster-design/');
      }
    </script>
  </head>
  <body>
    <noscript>JavaScript is required for this application.</noscript>
  </body>
</html>
